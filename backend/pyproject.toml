[project]
name = "orrfin-backend"
version = "0.1.0"
description = "Orrfin Control Gate API (FastAPI). See docs/BUILD_PLAN.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    # Pure-Python driver: Windows Smart App Control blocks the psycopg binary DLL
    # on the founder's laptop (docs/adr/0001-postgres-driver-pg8000.md).
    "pg8000>=1.31,<2",
    # Invoice PDF upload (multipart form data) in FastAPI (PROMPTS Step 7).
    "python-multipart>=0.0.9,<1",
    # Password hashing for login (BUILD_PLAN §3 Auth: argon2).
    "argon2-cffi>=23,<26",
    # Claude on Amazon Bedrock (BUILD_PLAN §3 AI row); the [bedrock] extra brings boto3.
    "anthropic[bedrock]>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    # Generates synthetic invoice PDFs under seed/ (backend/scripts/make_sample_invoice.py).
    "reportlab>=4,<6",
    # Reads the evaluation PDFs back in tests (tests/contract/test_eval_invoices.py).
    "pypdf>=5,<7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
