[project]
name = "orrfin-backend"
version = "0.1.0"
description = "Orrfin Control Gate API (FastAPI). See docs/BUILD_PLAN.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    # Pure-Python driver: Windows Smart App Control blocks the psycopg binary DLL
    # on the founder's laptop (docs/adr/0001-postgres-driver-pg8000.md).
    "pg8000>=1.31,<2",
    # Invoice PDF upload (multipart form data) in FastAPI (PROMPTS Step 7).
    "python-multipart>=0.0.9,<1",
    # Password hashing for login (BUILD_PLAN §3 Auth: argon2).
    "argon2-cffi>=23,<26",
    # Claude on Amazon Bedrock (BUILD_PLAN §3 AI row); the [bedrock] extra brings boto3.
    "anthropic[bedrock]>=1.9,<2",
    # Google Gemini API: the working AI provider until Bedrock access is granted (docs/adr/0005).
    "google-genai>=1.30,<2",
    # ERP connectors (Steps 12-20): HTTP client, and XML parsing that blocks entity-expansion attacks (Tally).
    "httpx>=0.27,<1",
    "defusedxml>=0.7,<1",
    # Encrypts saved ERP credentials and two-step sign-in secrets (Fernet, ADR 0006). Used directly,
    # so listed here rather than relied on as another package's dependency.
    "cryptography>=42",
    # PO, RFQ, payment and audit PDFs (Step 37; Step 42 vendor PO) and reading contract PDFs (Step 33).
    "reportlab>=4,<6",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
