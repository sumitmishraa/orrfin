[project]
name = "orrfin-backend"
version = "0.1.0"
description = "Orrfin Control Gate API (FastAPI). See docs/BUILD_PLAN.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    # Pure-Python driver: Windows Smart App Control blocks the psycopg binary DLL
    # on the founder's laptop (docs/adr/0001-postgres-driver-pg8000.md).
    "pg8000>=1.31,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
