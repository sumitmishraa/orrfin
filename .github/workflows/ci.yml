# Continuous integration (BUILD_PLAN §3 "CI"): pytest against a real Postgres 16 service container.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orrfin
          POSTGRES_USER: orrfin
          # Throwaway password for the CI-only container; not a real secret.
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orrfin -d orrfin"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql+pg8000://orrfin:ci-only@localhost:5432/orrfin

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      - name: Tests
        run: pytest
