# Local development services (BUILD_PLAN §3 "Local-first development").
# Only Postgres runs in Docker; the API and web app run on the laptop via scripts/dev.ps1.
# Values come from the repo-root .env (dev.ps1 passes --env-file .env).

name: orrfin

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orrfin}
      POSTGRES_USER: ${POSTGRES_USER:-orrfin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only, so the database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- Odoo 19 Community for the live Odoo connector (PROMPTS Step 20). Starts only when asked:
  #     docker compose --profile odoo up -d   (scripts/odoo_setup.ps1 or dev.ps1 -Odoo do this for you)
  odoo-db:
    image: postgres:16
    profiles: ["odoo"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo-local-only}
    volumes:
      - odoo-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 2s
      timeout: 3s
      retries: 30

  odoo:
    image: odoo:19
    profiles: ["odoo"]
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo-local-only}
    ports:
      # Localhost only: the demo Odoo is never reachable from the network.
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo

volumes:
  pgdata:
  odoo-dbdata:
  odoo-data:
