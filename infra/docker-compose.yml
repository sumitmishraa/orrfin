# Local development services (BUILD_PLAN §3 "Local-first development").
# Only Postgres runs in Docker; the API and web app run on the laptop via scripts/dev.ps1.
# Values come from the repo-root .env (dev.ps1 passes --env-file .env).

name: orrfin

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orrfin}
      POSTGRES_USER: ${POSTGRES_USER:-orrfin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only, so the database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
